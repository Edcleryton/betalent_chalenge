name: Playwright Tests — UI + API

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 8 * * *'   # diariamente às 08:00 UTC (05:00 BRT)

jobs:
  playwright-tests:
    name: Run Playwright Tests (api + chromium)
    runs-on: ubuntu-latest

    env:
      API_URL: ${{ secrets.API_URL }}
      UI_URL: ${{ secrets.UI_URL }}
      API_USER: ${{ secrets.API_USER }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium browser + OS deps
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (api + chromium)
        id: run_tests
        continue-on-error: true
        run: npx playwright test --project=api --project=chromium

      - name: Zip Playwright report
        if: always()
        run: zip -r playwright-report.zip playwright-report/

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report.zip
          retention-days: 30

      - name: Generate PDF summary
        if: always()
        run: node scripts/generate-playwright-pdf.js

      - name: Convert summary to PDF
        if: always()
        run: |
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || echo "")
          if [ -z "$CHROME" ]; then
            echo "WARNING: Chrome not found, skipping PDF conversion"
          else
            $CHROME --headless --no-sandbox --disable-gpu \
              --print-to-pdf="${GITHUB_WORKSPACE}/reports/summary.pdf" \
              "file://${GITHUB_WORKSPACE}/reports/summary.html"
            echo "PDF gerado: $(du -sh ${GITHUB_WORKSPACE}/reports/summary.pdf 2>/dev/null || echo 'arquivo nao encontrado')"
          fi

      - name: Send email with results
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: >-
            ${{ steps.run_tests.outcome == 'success' && '✅' || '⚠️' }}
            Playwright Tests — Run #${{ github.run_number }} —
            ${{ steps.run_tests.outcome == 'success' && 'todos passaram' || 'falhas nos testes' }}
          to: edcleryton.gabriel@gmail.com
          from: edcleryton.gabriel@gmail.com
          html_body: |
            <h2>Playwright Tests — BeTalent QA Suite</h2>
            <table cellpadding="6" cellspacing="0" style="border-collapse:collapse">
              <tr>
                <td><b>Pipeline</b></td>
                <td>✅ Executado com sucesso</td>
              </tr>
              <tr>
                <td><b>Testes</b></td>
                <td>${{ steps.run_tests.outcome == 'success' && '✅ Todos passaram' || '⚠️ Falhas detectadas nos testes' }}</td>
              </tr>
              <tr><td><b>Projetos</b></td><td>api, chromium</td></tr>
              <tr><td><b>Trigger</b></td><td>${{ github.event_name }}</td></tr>
              <tr><td><b>Branch</b></td><td>${{ github.ref_name }}</td></tr>
              <tr><td><b>Commit</b></td><td><code>${{ github.sha }}</code></td></tr>
              <tr>
                <td><b>Run</b></td>
                <td><a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">
                  Run #${{ github.run_number }}</a></td>
              </tr>
              <tr><td><b>Autor</b></td><td>${{ github.actor }}</td></tr>
            </table>
            ${{ steps.run_tests.outcome != 'success' && '
            <p style="margin-top:12px;padding:10px;background:#fff8e1;border-left:4px solid #f9a825;font-size:13px">
              <b>ℹ️ Sobre as falhas:</b> os testes falharam porque assertam o comportamento
              correto segundo a RFC — a API possui bugs conhecidos documentados que ainda
              não foram corrigidos. O pipeline rodou normalmente; as falhas são sinais de
              rastreamento dos bugs, não erros de infraestrutura.
            </p>' || '' }}
            <p style="margin-top:12px;font-size:12px;color:#555">
              Resumo em PDF anexado. Relatório HTML completo disponível nos artifacts do GitHub Actions.
            </p>
          attachments: reports/summary.pdf
